name = "ptxlean_torchlean_integration"
version = "0.1.0"
defaultTargets = ["PtxTorchLean", "PtxTensorBridge", "PtxBinary32", "PtxBinary32Bounds", "PtxBinary32Examples", "PtxBinary32Error"]

[[require]]
name = "ptxlean"
path = "../.."

[[require]]
name = "TorchLean"
git = "https://github.com/lean-dojo/TorchLean.git"
rev = "de3192df4779877ceb65cfe470a4d4ce9d480a5b"

[[lean_lib]]
name = "PtxTorchLean"

[[lean_lib]]
name = "PtxTensorBridge"

[[lean_lib]]
name = "PtxBinary32"

[[lean_lib]]
name = "PtxBinary32Bounds"

[[lean_lib]]
name = "PtxBinary32Examples"

[[lean_lib]]
name = "PtxBinary32Error"
